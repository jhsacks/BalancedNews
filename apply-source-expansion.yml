name: Apply source expansion
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge new sources into current config
        run: python upgrade_sources.py
      - name: Validate config
        run: python -m json.tool config.json > /dev/null
      - name: Commit expanded source list
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add config.json
          git commit -m "Expand Balanced Brief sources" || exit 0
          git push
