name: Apply editorial category policy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch current working generator
        run: python apply_editorial_policy.py
      - name: Update editorial configuration
        run: python apply_editorial_config.py
      - name: Validate files
        run: |
          python -m py_compile generate_brief.py
          python -m json.tool config.json > /dev/null
      - name: Commit editorial policy
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add generate_brief.py config.json
          git commit -m "Apply independent category editorial policy" || exit 0
          git push
