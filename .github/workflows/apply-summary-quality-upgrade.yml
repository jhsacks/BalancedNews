name: Apply summary quality upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade the deployed generator prompt
        run: python apply_summary_quality_upgrade.py
      - name: Validate generator
        run: python -m py_compile generate_brief.py
      - name: Commit prompt upgrade
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add generate_brief.py
          git commit -m "Improve briefing specificity and perspective depth" || exit 0
          git push
