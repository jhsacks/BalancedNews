name: Restore substantive perspectives
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply prompt and validation upgrade
        run: python apply_perspective_quality.py
      - name: Validate generator
        run: python -m py_compile generate_brief.py
      - name: Commit upgrade
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add generate_brief.py
          git commit -m "Restore substantive perspectives" || exit 0
          git push
