name: Fix Good News duplicate check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted fix
        run: python fix_repeated_good.py
      - name: Validate generator
        run: python -m py_compile generate_brief.py
      - name: Commit fix
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add generate_brief.py
          git commit -m "Fix Good News duplicate check" || exit 0
          git push
