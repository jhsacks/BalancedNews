name: Generate dated news brief

on:
  workflow_dispatch:
    inputs:
      edition:
        description: AM or PM
        required: true
        default: AM

  schedule:
    - cron: '50 9 * * *'
    - cron: '50 10 * * *'
    - cron: '1 20 * * *'
    - cron: '1 21 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Determine edition
        id: gate
        shell: python
        run: |
          import os

          event = '${{ github.event_name }}'
          manual = '${{ inputs.edition }}'
          schedule = '${{ github.event.schedule }}'

          if event == 'workflow_dispatch':
              edition = manual
          elif schedule in ('50 9 * * *', '50 10 * * *'):
              edition = 'AM'
          elif schedule in ('1 20 * * *', '1 21 * * *'):
              edition = 'PM'
          else:
              edition = ''

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"edition={edition}\n")
              f.write(f"run={'true' if edition else 'false'}\n")

      - name: Generate briefing
        if: steps.gate.outputs.run == 'true'
        env:
          BRIEF_EDITION: ${{ steps.gate.outputs.edition }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python list_kit_templates.py

      - name: Generate missing story visuals
        if: steps.gate.outputs.run == 'true'
        env:
          BRIEF_EDITION: ${{ steps.gate.outputs.edition }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-1-mini
          MAX_GENERATED_IMAGES: '10'
        run: python fill_missing_images.py

      - name: Commit dated archive and visuals
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add data/briefings
          git commit -m "Add ${{ steps.gate.outputs.edition }} briefing and visuals" || exit 0
          git push
