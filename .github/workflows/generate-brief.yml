name: Generate dated news brief
on:
  workflow_dispatch:
    inputs:
      edition:
        description: AM or PM
        required: true
        default: AM
  schedule:
    - cron: '50 9 * * *'
    - cron: '50 10 * * *'
    - cron: '1 20 * * *'
    - cron: '1 21 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Determine edition
        id: gate
        shell: python
        run: |
          import os

          event = '${{ github.event_name }}'
          manual = '${{ inputs.edition }}'
          schedule = '${{ github.event.schedule }}'

          if event == 'workflow_dispatch':
              edition = manual

          elif schedule == '50 9 * * *':
              edition = 'AM'

 *        elif schedule == '50 10 * * *':
              edition = 'AM'
*          elif schedule == '1 20 *** *':
              edition = 'PM'*
          elif schedule == '1 21 * * *':
              edition = 'PM*

          else:
              ed*tion = ''

          with open(os.*nviron['GITHUB_OUTPUT'], 'a') as f*
              f.write(f"edition={*dition}\n")
              f.write(*"run={'true' if edition else 'fals*'}\n")

      - name: Generate bri*fing
        if: steps.gate.output*.run == 'true'
        env:
      *   BRIEF_EDITION: ${{ steps.gate.o*tputs.edition }}
          OPENAI_*PI_KEY: ${{ secrets.OPENAI_API_KEY*}}
          OPENAI_MODEL: gpt-4.1*mini
        run: python generate_*rief.py

      - name: Generate mi*sing story visuals
        if: ste*s.gate.outputs.run == 'true'
     *  env:
          BRIEF_EDITION: ${* steps.gate.outputs.edition }}
   *      OPENAI_API_KEY: ${{ secrets.*PENAI_API_KEY }}
          OPENAI_*MAGE_MODEL: gpt-image-1-mini
     *    MAX_GENERATED_IMAGES: '10'
   *    run: python fill_missing_image*.py

      - name: Commit dated ar*hive and visuals
        if: steps*gate.outputs.run == 'true'
       *run: |
          git config user.n*me balanced-brief-bot
          gi* config user.email actions@users.n*reply.github.com
          git add*data/briefings
          git commi* -m "Add ${{ steps.gate.outputs.ed*tion }} briefing and visuals" || e*it 0
          git push
