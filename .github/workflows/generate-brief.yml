name: Generate dated news brief
on:
  workflow_dispatch:
    inputs:
      edition:
        description: AM or PM
        required: true
        default: AM
  schedule:
    - cron: '5 10 * * *'
    - cron: '5 11 * * *'
    - cron: '5 20 * * *'
    - cron: '5 21 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Determine edition
        id: gate
        shell: python
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          event='${{ github.event_name }}'; manual='${{ inputs.edition }}'; now=datetime.now(ZoneInfo('America/New_York'))
          edition=manual if event=='workflow_dispatch' else ('AM' if now.hour==6 else 'PM' if now.hour==16 else '')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"edition={edition}\nrun={'true' if edition else 'false'}\n")
      - name: Generate
        if: steps.gate.outputs.run == 'true'
        env:
          BRIEF_EDITION: ${{ steps.gate.outputs.edition }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python generate_brief.py
      - name: Commit archive
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add data/briefings
          git commit -m "Add ${{ steps.gate.outputs.edition }} briefing" || exit 0
          git push
