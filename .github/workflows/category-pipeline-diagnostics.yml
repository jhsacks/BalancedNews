name: Diagnose category pipeline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Diagnose feeds, freshness, and output
        run: python category_pipeline_diagnostics.py
      - name: Commit diagnostic report
        run: |
          git config user.name balanced-brief-bot
          git config user.email actions@users.noreply.github.com
          git add data/briefings/category_pipeline_diagnostics.json
          git commit -m "Update category pipeline diagnostics" || exit 0
          git push
